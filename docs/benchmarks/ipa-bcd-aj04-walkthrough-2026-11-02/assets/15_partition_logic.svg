  <g id="text_21">
   <text style="fill: #18334c; font: 700 25px 'Noto Sans CJK JP'; text-anchor: start" x="46.08" y="37.584" transform="rotate(-0 46.08 37.584)">BCD 怎么把一个房间切成几个区域？</text>
  </g>
  <g id="text_22">
   <text style="fill: #18334c; font: 13px 'Noto Sans CJK JP'; text-anchor: start" x="46.08" y="72.036" transform="rotate(-0 46.08 72.036)">教学示意｜三个画面是同一个房间；白色可通行，深色为墙或障碍；扫描线向下移动。</text>
  </g>
  <g id="text_23">
   <text style="fill: #dd4b4b; font: 700 18px 'Noto Sans CJK JP'; text-anchor: start" x="46.08" y="541.836" transform="rotate(-0 46.08 541.836)">关键：段数变化只触发候选检查；满足临界点条件，才真正画线。</text>
  </g>
  <g id="text_24">
   <text style="fill: #18334c; font: 12px 'Noto Sans CJK JP'; text-anchor: start" x="46.08" y="580.6728" transform="rotate(-0 46.08 580.6728)">分区线是临时的编号边界，机器人仍可跨区通行。这里的 4 区是教学示意；AJ04 的实际结果是 80 区。</text>
  </g>
 </g>
